<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>needsFix harness</title>
    <!--
      A HARNESS, NOT A DEMO. It mounts the real CartMoment against a fixture cart so the
      list can be measured and clicked at a true 390px without driving onboarding, a phone
      code and a live account first. Same reason test/skim.mjs exists: a rendered-line
      claim needs a browser, and a claim about a tap target needs a real pointer.

      It renders the SHIPPING component and the SHIPPING styles. Nothing is reimplemented
      here — only the cart state is faked, and it is faked in the exact shape the server
      returns, `cardSlug` and `cardSection` included.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./needsFixMount.jsx"></script>
  </body>
</html>
