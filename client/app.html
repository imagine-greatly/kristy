<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#040805" />
    <title>Kristy</title>
    <!-- Favicon = the mark: the gold hair silhouette on the forest ground. The
         ground is baked in because a favicon is an opaque square, unlike the app
         logo which stays transparent. The 16/32 variants merge the finest hair
         strands so the negative-space face still reads at tab size. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <!-- PWA: installable "Add to Home Screen" support. Icons + colors live in
         /manifest.json; iOS reads the apple-* tags for home-screen behavior. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Kristy" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Boot guard — the only layer that can catch a failure BEFORE React exists.
         A throw during module EVALUATION (an import-time error, a chunk that 404s)
         kills the bundle outright: #root stays empty and the #040805 body reads as a
         black screen with nothing on it. React's error boundary ships inside that
         same bundle, so it cannot catch what killed it. This script owns no imports,
         runs first, and paints a legible message only if #root is still empty.
         Colors mirror src/lib/tokens.js — an inline guard can't import them. -->
    <script>
      (function () {
        var painted = false;
        function paint(detail) {
          var root = document.getElementById('root');
          if (painted || !root || root.childElementCount > 0) return;
          painted = true;
          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#040805;color:#F0E6C8;font-family:Inter,system-ui,sans-serif">' +
            '<div style="max-width:380px">' +
            '<p style="font-family:\'Playfair Display\',Georgia,serif;font-style:italic;font-size:22px;margin:0 0 10px">Kristy didn\'t start.</p>' +
            '<p style="font-size:15px;line-height:1.55;color:#6B8F72;margin:0 0 18px">The app failed to load before it could show you anything. Reloading often clears it.</p>' +
            '<button type="button" id="boot-reload" style="font-family:Inter,system-ui,sans-serif;font-size:15px;padding:11px 22px;border-radius:999px;border:1px solid #8B6F2E;background:transparent;color:#C9A84C;cursor:pointer">Reload</button>' +
            '<pre id="boot-detail" style="margin:22px 0 0;padding:12px;border-radius:10px;background:#122718;color:#6B8F72;font-family:\'DM Mono\',ui-monospace,monospace;font-size:12px;line-height:1.5;text-align:left;white-space:pre-wrap;word-break:break-word"></pre>' +
            '</div></div>';
          // textContent, not innerHTML — the detail is an error string, never markup.
          var pre = document.getElementById('boot-detail');
          if (pre) pre.textContent = String(detail || 'No error detail available.');
          var btn = document.getElementById('boot-reload');
          if (btn) btn.addEventListener('click', function () { window.location.reload(); });
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            // Ignore resource errors from images/stylesheets — a font that 404s does
            // not mean the app failed to boot. A <script> that won't load does.
            if (t && t !== window && t.tagName && t.tagName !== 'SCRIPT') return;
            paint((e && (e.message || (e.error && e.error.message))) || 'A script failed to load.');
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          paint((r && (r.message || r)) || 'A startup step failed.');
        });
        // Backstop for a silent failure that raises no error event at all. Harmless
        // when the app is healthy: paint() bails the moment #root has children.
        window.addEventListener('load', function () {
          setTimeout(function () { paint('The app loaded but rendered nothing.'); }, 1500);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
